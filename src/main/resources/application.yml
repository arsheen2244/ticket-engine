server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DB_USER:tickets}
    password: ${DB_PASSWORD:tickets}
    hikari:
      maximum-pool-size: ${DB_POOL:30}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      group-id: ticket-engine
ticket:
  # false = the app behaves exactly as before and needs no Kafka.
  # true  = enables the redis_async strategy, consumer, outbox publisher and notification listener.
  async: ${TICKET_ASYNC:false}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
