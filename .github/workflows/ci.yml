name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Backend: unit and integration tests against real Postgres and Redis (Kafka is embedded in the tests).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tickets
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run tests
        run: mvn -B verify

  # Frontend: lint, type check, unit/component tests, production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Whole stack: build both images, start everything with one command, run an end-to-end smoke test.
  stack:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 420 2>&1 | tee /tmp/stack.log
      - name: Smoke test through the frontend proxy
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh 2>&1 | tee -a /tmp/stack.log
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a 2>&1 | tee -a /tmp/stack.log
          docker compose logs --no-color --tail 200 2>&1 | tee /tmp/containers.log
          # Annotations appear on the run's summary page, readable without opening the full log.
          annotate() { printf '::error title=%s::%s\n' "$1" "$(tail -n 40 "$2" | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          annotate "Stack: last lines of build, start and smoke test" /tmp/stack.log
          annotate "Stack: last lines of container logs" /tmp/containers.log
      - name: Stop
        if: always()
        run: docker compose down -v
