# Render Blueprint: Render reads this file and creates the backend web service for you.
# Values marked "sync: false" are secrets: Render asks you to type them in the dashboard
# and they are never stored in this repo. "generateValue: true" makes Render create a random secret.
# The frontend is deployed separately (Vercel, or a second Render service); see DEPLOY.md.
services:
  - type: web
    name: ticket-engine
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: LEGACY_ENDPOINTS
        value: "false"
      - key: DB_POOL
        value: "5"
